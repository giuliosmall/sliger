[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sliger"
version = "0.2.0"
description = "Slide the power of Python (and Jinja2) into Google Slides"
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "Giulio Piccolo", email = "gipiccol@cisco.com" },
]
requires-python = ">=3.10"
keywords = ["google-slides", "jinja2", "cli", "presentations"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Office Suites",
]
dependencies = [
    "typer>=0.12.0",
    "google-api-python-client>=2.87.0",
    "google-auth>=2.19.0",
    "jinja2>=3.1.2",
    "tomli>=2.0.1; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/slidoapp/sliger"
Issues = "https://github.com/slidoapp/sliger/issues"

[project.scripts]
sliger = "sliger.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "pre-commit>=4.0",
]
demo = [
    "streamlit>=1.28.0",
]

[tool.uv]
default-groups = ["dev"]

[tool.hatch.build.targets.wheel]
packages = ["sliger"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["sliger", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "B008",  # typer.Option() in defaults is the recommended pattern
]

[tool.ruff.lint.isort]
known-first-party = ["sliger"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["sliger"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
